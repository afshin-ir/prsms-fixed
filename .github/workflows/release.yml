name: Build and publish signed release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .release-version
      - .github/workflows/release.yml
      - presentation/src/main/java/**
      - presentation/src/main/res/**
      - domain/src/main/java/**
      - data/src/main/java/**
      - build.gradle
      - presentation/build.gradle
      - presentation/src/main/java/com/freetux/PRSMS/feature/gallery/GalleryPagerAdapter.kt
      - data/build.gradle
      - data/src/main/java/com/callcontrol/datashare/CallControl.java

permissions:
  contents: write

jobs:
  build:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASS" || { echo "::error::Missing KEYSTORE_PASS secret"; exit 1; }
          test -n "$ALIAS_NAME" || { echo "::error::Missing ALIAS_NAME secret"; exit 1; }
          test -n "$ALIAS_PASS" || { echo "::error::Missing ALIAS_PASS secret"; exit 1; }

      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin

      - name: Read release version
        run: |
          RELEASE_TAG="$(tr -d '[:space:]' < .release-version)"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag: $RELEASE_TAG"; exit 1; }
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > presentation/Keystore.jks
          test -s presentation/Keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :presentation:assembleNoAnalyticsRelease
          APK_PATH="$(find presentation/build/outputs/apk/noAnalytics/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || { echo "::error::Gradle did not produce a release APK"; exit 1; }
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "پیامک $RELEASE_TAG" \
              --notes "اصلاح نمایش تاریخ و ساعت در گفت‌وگوی باز؛ تاریخ جلالی اکنون همیشه به صورت روز، ماه و سال و پیش از ساعت نمایش داده می‌شود." \
              --target "$GITHUB_SHA"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f presentation/Keystore.jks
